name: Release decks

# Builds the corrected (and optionally compressed) decks on GitHub's servers,
# checks that people who already study the AnkiWeb/GitHub versions keep their
# review history, and (only when "publish" is ticked) creates the GitHub releases.

on:
  workflow_dispatch:
    inputs:
      old_books_tag:
        description: "Release tag for the Old Books decks"
        required: true
        default: "v1.2.0"
      old_books_title:
        description: "Release title for the Old Books decks"
        required: true
        default: "4000 EEW (Old Books) — smaller download"
      second_edition_tag:
        description: "Release tag for the 2nd Edition deck (only used when it is released too)"
        required: true
        default: "v2.2.0"
      second_edition_title:
        description: "Release title for the 2nd Edition deck"
        required: true
        default: "4000 EEW (2nd Edition) — smaller download"
      old_books_audio_kbps:
        description: "Old Books: mono MP3 bitrate (empty = keep audio)"
        default: "32"
      old_books_webp:
        description: "Old Books: WebP quality for images (empty = keep images)"
        default: "85"
      second_edition_audio_kbps:
        description: "2nd Edition: mono MP3 bitrate (empty = keep audio; it is already ~38 kbps VBR)"
        default: ""
      release_second_edition:
        description: "Also create a 2nd Edition release"
        type: boolean
        default: false
      publish:
        description: "Create the releases (otherwise only build, check and make listening samples)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_BOOKS_TAG: ${{ inputs.old_books_tag }}
      OLD_BOOKS_TITLE: ${{ inputs.old_books_title }}
      SECOND_EDITION_TAG: ${{ inputs.second_edition_tag }}
      SECOND_EDITION_TITLE: ${{ inputs.second_edition_title }}
      OLD_KBPS: ${{ inputs.old_books_audio_kbps }}
      OLD_WEBP: ${{ inputs.old_books_webp }}
      SECOND_KBPS: ${{ inputs.second_edition_audio_kbps }}
      RELEASE_SECOND: ${{ inputs.release_second_edition }}
      # The 2nd Edition source is the published v2.0.0 asset (identical to AnkiWeb).
      SOURCE_TAG: v2.0.0
      SOURCE_ASSET: 4000.EEW.2nd.Edition.apkg
      SOURCE_SHA256: 479a870fc1ab1ea2e5732dc0074e31c240054ee013acef4eecc6769b41bddedf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install zstandard==0.23.0 pillow==11.0.0
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Check release notes exist
        if: ${{ inputs.publish }}
        run: |
          test -f "docs/release-notes/$OLD_BOOKS_TAG.md"
          if [ "$RELEASE_SECOND" = "true" ]; then test -f "docs/release-notes/$SECOND_EDITION_TAG.md"; fi

      - name: Download the published 2nd Edition deck
        run: |
          mkdir -p source
          gh release download "$SOURCE_TAG" --pattern "$SOURCE_ASSET" --dir source
          echo "$SOURCE_SHA256  source/$SOURCE_ASSET" | sha256sum --check -

      - name: Check the sources against the AnkiWeb baselines
        run: |
          python scripts/compat/verify_apkg.py dist/old-books/*.apkg "source/$SOURCE_ASSET"
          python scripts/compat/check_compat.py check --baseline data/guid-baseline/old-books.json dist/old-books/*.apkg
          python scripts/compat/check_compat.py check --baseline data/guid-baseline/2nd-edition.json "source/$SOURCE_ASSET"

      - name: Apply hint, translation and typo fixes
        run: |
          set -o pipefail
          python scripts/fix/fix_deck.py --edition old-books --out-dir out/fixed --report out/changes-old-books.md dist/old-books/*.apkg
          python scripts/fix/fix_deck.py --edition 2nd-edition --out-dir out/fixed --report out/changes-2nd-edition.md "source/$SOURCE_ASSET"
          # A second run must change nothing.
          python scripts/fix/fix_deck.py --edition old-books --out-dir again out/fixed/4000EEW_Old_Book_*.apkg | tee again.log
          python scripts/fix/fix_deck.py --edition 2nd-edition --out-dir again "out/fixed/$SOURCE_ASSET" | tee -a again.log
          if grep -E ": [1-9][0-9]* note\(s\) changed|updated media file" again.log; then
            echo "fix_deck.py is not idempotent"; exit 1
          fi

      - name: Compress media
        run: |
          set -o pipefail
          mkdir -p out/final
          old_args=""; [ -n "$OLD_KBPS" ] && old_args="$old_args --audio-kbps $OLD_KBPS"; [ -n "$OLD_WEBP" ] && old_args="$old_args --webp $OLD_WEBP"
          if [ -n "$old_args" ]; then
            python scripts/fix/compress_media.py $old_args --out-dir out/final --samples-dir out/samples --samples 2 out/fixed/4000EEW_Old_Book_*.apkg | tee compress.log
            # A second run must change nothing (no re-encoding of compressed files).
            python scripts/fix/compress_media.py $old_args --out-dir again2 out/final/4000EEW_Old_Book_*.apkg | tee again2.log
          else
            cp out/fixed/4000EEW_Old_Book_*.apkg out/final/
          fi
          if [ -n "$SECOND_KBPS" ]; then
            python scripts/fix/compress_media.py --audio-kbps "$SECOND_KBPS" --out-dir out/final --samples-dir out/samples --samples 4 "out/fixed/$SOURCE_ASSET" | tee -a compress.log
            python scripts/fix/compress_media.py --audio-kbps "$SECOND_KBPS" --out-dir again2 "out/final/$SOURCE_ASSET" | tee -a again2.log
          else
            cp "out/fixed/$SOURCE_ASSET" out/final/
          fi
          touch compress.log again2.log
          if grep -E ": [1-9][0-9]* media file" again2.log; then
            echo "compress_media.py is not idempotent"; exit 1
          fi

      - name: Check the new decks
        run: |
          python scripts/compat/verify_apkg.py out/final/*.apkg
          python scripts/compat/check_compat.py check --baseline data/guid-baseline/old-books.json out/final/4000EEW_Old_Book_*.apkg
          python scripts/compat/check_compat.py check --baseline data/guid-baseline/2nd-edition.json "out/final/$SOURCE_ASSET"
          (cd out/final && sha256sum *.apkg | tee ../SHA256SUMS.txt)
          ls -l out/fixed out/final

      - name: Keep the change reports and listening samples
        uses: actions/upload-artifact@v4
        with:
          name: change-reports
          path: |
            out/*.md
            out/SHA256SUMS.txt
            out/samples/
            compress.log

      - name: Publish the releases
        if: ${{ inputs.publish }}
        run: |
          gh release create "$OLD_BOOKS_TAG" out/final/4000EEW_Old_Book_*.apkg \
            --target "$GITHUB_SHA" --latest=false \
            --title "$OLD_BOOKS_TITLE" \
            --notes-file "docs/release-notes/$OLD_BOOKS_TAG.md"
          gh release create "$SECOND_EDITION_TAG" "out/final/$SOURCE_ASSET" \
            --target "$GITHUB_SHA" --latest \
            --title "$SECOND_EDITION_TITLE" \
            --notes-file "docs/release-notes/$SECOND_EDITION_TAG.md"
